<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fundamental analysis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--border:#2a3340;--txt:#e6edf3;--muted:#9aa7b4;--accent:#4c8dff;
    --green:#2ea043;--green-bg:rgba(46,160,67,.13);--amber:#d29922;--amber-bg:rgba(210,153,34,.13);--red:#f85149;--red-bg:rgba(248,81,73,.13);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;padding:32px 20px 80px}
  .wrap{max-width:1080px;margin:0 auto}
  header.hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:22px}
  .ticker{font-size:13px;letter-spacing:.14em;color:var(--accent);font-weight:700}
  h1{font-size:30px;font-weight:700;margin:2px 0 4px}
  .sub{color:var(--muted);font-size:14px}
  .price-box{text-align:right}
  .price{font-size:32px;font-weight:700}.price small{font-size:14px;color:var(--muted);font-weight:400}
  .asof{color:var(--muted);font-size:12px;margin-top:2px}
  section{margin-top:38px}
  h2{font-size:19px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:9px}
  h2 .bar{width:4px;height:20px;background:var(--accent);border-radius:2px}
  .lead{color:var(--muted);font-size:14px;margin-bottom:18px;max-width:880px}
  .verdict{display:flex;flex-wrap:wrap;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 24px}
  .score-ring{flex:0 0 auto;width:118px;height:118px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  .score-ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--panel)}
  .score-ring b{position:relative;font-size:30px;line-height:1}.score-ring span{position:relative;font-size:11px;color:var(--muted);margin-top:3px}
  .verdict-txt{flex:1;min-width:260px}.verdict-txt h3{font-size:18px;margin-bottom:6px}.verdict-txt p{color:var(--muted);font-size:14px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;margin:4px 6px 0 0}
  .pill.g{background:var(--green-bg);color:var(--green)}.pill.a{background:var(--amber-bg);color:var(--amber)}.pill.r{background:var(--red-bg);color:var(--red)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .kpi .k{font-size:12px;color:var(--muted)}.kpi .v{font-size:22px;font-weight:700;margin-top:3px}.kpi .d{font-size:12px;margin-top:2px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
  th{background:var(--panel2);font-size:12px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;font-weight:600}
  tr:last-child td{border-bottom:none}
  td.num{font-variant-numeric:tabular-nums;font-weight:600}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
  .badge.g{background:var(--green-bg);color:var(--green)}.badge.a{background:var(--amber-bg);color:var(--amber)}.badge.r{background:var(--red-bg);color:var(--red)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 18px 8px}
  .card h4{font-size:14px;margin-bottom:2px}.card p.cm{font-size:12px;color:var(--muted);margin-bottom:10px}
  .chart-box{position:relative;height:240px}
  .note{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:14px 18px;margin-top:14px;font-size:14px;color:var(--muted)}
  .note b{color:var(--txt)}
  footer{margin-top:48px;border-top:1px solid var(--border);padding-top:18px;color:var(--muted);font-size:12px}
  footer a{color:var(--accent);text-decoration:none}
  @media(max-width:760px){.charts{grid-template-columns:1fr}h1{font-size:24px}.price{font-size:26px}}
</style>
</head>
<body>

<script>
/* Данните се четат от <script id="report-data">. За нов тикер сменяш САМО този JSON блок. */
var D = JSON.parse(document.getElementById('report-data').textContent);
var COL = {grid:'#2a3340',txt:'#9aa7b4',blue:'#4c8dff',green:'#2ea043',amber:'#d29922',red:'#f85149',purple:'#a371f7',teal:'#39c5cf'};
var SLAB = {g:'Покрива',a:'Внимание',r:'Червен флаг'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var pct = D.scoreMet / D.scoreTotal * 100;
var ringBg = 'conic-gradient(var(--green) 0 ' + pct + '%, var(--amber) ' + pct + '% 100%)';
var kpiHtml = D.kpis.map(function(k){return '<div class="kpi"><div class="k">'+esc(k.k)+'</div><div class="v">'+esc(k.v)+'</div><div class="d">'+esc(k.d)+'</div></div>';}).join('');
var pillHtml = D.metrics.map(function(m){var s=m.status==='g'?'✓':m.status==='a'?'⚠':'✕';return '<span class="pill '+m.status+'">'+esc(m.name)+' '+s+'</span>';}).join('');
var scoreRows = D.metrics.map(function(m){return '<tr><td><b>'+esc(m.name)+'</b><br><span style="color:var(--muted);font-size:12px">'+esc(m.bg)+'</span></td><td>'+esc(m.threshold)+'</td><td class="num">'+esc(m.value)+'</td><td><span class="badge '+m.status+'"><span class="dot"></span>'+SLAB[m.status]+'</span></td><td>'+esc(m.comment)+'</td></tr>';}).join('');
var extraRows = D.extra.map(function(e){return '<tr><td>'+esc(e.name)+'</td><td class="num">'+esc(e.value)+'</td><td>'+esc(e.note)+'</td></tr>';}).join('');
document.getElementById('app').innerHTML =
  '<header class="hero"><div><div class="ticker">'+esc(D.exchange)+' : '+esc(D.ticker)+'</div>'+
  '<h1>'+esc(D.company)+'</h1><div class="sub">Фундаментален анализ - '+esc(D.sector)+'</div></div>'+
  '<div class="price-box"><div class="price">'+esc(D.price)+' <small>USD</small></div><div class="asof">'+esc(D.asof)+'</div></div></header>'+
  '<section style="margin-top:24px"><div class="verdict"><div class="score-ring" style="background:'+ringBg+'"><b>'+D.scoreMet+'/'+D.scoreTotal+'</b><span>критерия</span></div>'+
  '<div class="verdict-txt"><h3>'+esc(D.verdictTitle)+'</h3><p>'+esc(D.verdictText)+'</p><div style="margin-top:8px">'+pillHtml+'</div></div></div></section>'+
  '<section><h2><span class="bar"></span>Ключови показатели (TTM / текущи)</h2><div class="kpis">'+kpiHtml+'</div></section>'+
  '<section><h2><span class="bar"></span>Карта на критериите</h2>'+
  '<p class="lead">Всеки показател е сравнен директно със зададените прагове. Зелено = покрива; жълто = гранично/в рамките на изключение; червено = червен флаг.</p>'+
  '<table><thead><tr><th>Показател</th><th>Праг</th><th>Стойност</th><th>Оценка</th><th>Коментар</th></tr></thead><tbody>'+scoreRows+'</tbody></table>'+
  (D.deRatioNote?'<div class="note"><b>Бележка за Debt/Equity:</b> '+esc(D.deRatioNote)+'</div>':'')+'</section>'+
  '<section><h2><span class="bar"></span>Тенденции</h2>'+
  '<p class="lead">Историческо развитие на ключовите показатели. Пунктираните линии маркират праговете.</p>'+
  '<div class="charts">'+
  '<div class="card"><h4>Приходи и нетна печалба</h4><p class="cm">млрд. USD</p><div class="chart-box"><canvas id="chRev"></canvas></div></div>'+
  '<div class="card"><h4>Маржове на печалба</h4><p class="cm">% - брутен / оперативен / нетен</p><div class="chart-box"><canvas id="chMargin"></canvas></div></div>'+
  '<div class="card"><h4>ROE и ROIC спрямо праговете</h4><p class="cm">%</p><div class="chart-box"><canvas id="chReturns"></canvas></div></div>'+
  '<div class="card"><h4>Ливъридж: D/E и Дълг/EBITDA</h4><p class="cm">спрямо праговете</p><div class="chart-box"><canvas id="chLev"></canvas></div></div>'+
  '<div class="card"><h4>P/E във времето</h4><p class="cm">спрямо праговете 20 и 30</p><div class="chart-box"><canvas id="chPE"></canvas></div></div>'+
  '<div class="card"><h4>Карта на критериите (% покритие)</h4><p class="cm">над 100% = покрива прага</p><div class="chart-box"><canvas id="chScore"></canvas></div></div>'+
  '</div></section>'+
  '<section><h2><span class="bar"></span>Допълнителни показатели</h2>'+
  '<table><thead><tr><th>Показател</th><th>Стойност</th><th>Какво показва</th></tr></thead><tbody>'+extraRows+'</tbody></table>'+
  (D.watchNote?'<div class="note"><b>Какво да следиш:</b> '+esc(D.watchNote)+'</div>':'')+'</section>'+
  '<section><h2><span class="bar"></span>Заключение</h2><p class="lead" style="max-width:900px">'+esc(D.bottomLine)+'</p>'+
  '<div class="note" style="border-left-color:var(--amber)"><b>Важно:</b> Това е аналитична информация по зададени критерии, не инвестиционен съвет. Решението и рискът са твои.</div></section>'+
  '<footer><div>Източник на данните: <a href="'+esc(D.sourceUrl)+'" target="_blank">'+esc(D.source)+'</a> - Анализ генериран на '+esc(D.genDate)+'.</div>'+
  '<div style="margin-top:6px">Генерирано от skill <b>stock-analysis</b>.</div></footer>';
function drawCharts(){
  Chart.defaults.color = COL.txt; Chart.defaults.font.family="-apple-system,Segoe UI,Roboto,sans-serif"; Chart.defaults.font.size=11;
  var gridO={grid:{color:COL.grid},ticks:{color:COL.txt}};
  function pctTick(v){return v+'%';}
  function hline(vals){return {id:'h'+Math.random(),afterDraw:function(c){var ctx=c.ctx,a=c.chartArea,sc=c.scales;vals.forEach(function(v){var yp=sc.y.getPixelForValue(v[0]);ctx.save();ctx.strokeStyle=v[1];ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(a.left,yp);ctx.lineTo(a.right,yp);ctx.stroke();ctx.fillStyle=v[1];ctx.font='bold 10px sans-serif';ctx.fillText(v[2],a.left+4,yp-4);ctx.restore();});}};}
  function g(id){return document.getElementById(id);}
  new Chart(g('chRev'),{type:'bar',data:{labels:D.labels,datasets:[{label:'Приходи',data:D.revenue,backgroundColor:COL.blue,borderRadius:4},{label:'Нетна печалба',data:D.netIncome,backgroundColor:COL.green,borderRadius:4}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:gridO,y:{grid:{color:COL.grid},ticks:{color:COL.txt},title:{display:true,text:'млрд. USD'}}}}});
  new Chart(g('chMargin'),{type:'line',data:{labels:D.labels,datasets:[{label:'Брутен',data:D.grossMargin,borderColor:COL.teal,tension:.3},{label:'Оперативен',data:D.opMargin,borderColor:COL.blue,tension:.3},{label:'Нетен',data:D.netMargin,borderColor:COL.green,tension:.3}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:gridO,y:{grid:{color:COL.grid},ticks:{color:COL.txt,callback:pctTick}}}}});
  new Chart(g('chReturns'),{type:'line',data:{labels:D.labels,datasets:[{label:'ROE',data:D.roe,borderColor:COL.purple,tension:.3,pointRadius:3},{label:'ROIC',data:D.roic,borderColor:COL.blue,tension:.3,pointRadius:3}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:gridO,y:{grid:{color:COL.grid},ticks:{color:COL.txt,callback:pctTick},suggestedMin:0}}},plugins:[hline([[D.thresholds.roe,COL.green,'ROE праг '+D.thresholds.roe+'%'],[D.thresholds.roic,COL.amber,'ROIC праг '+D.thresholds.roic+'%']])]});
  new Chart(g('chLev'),{type:'line',data:{labels:D.labels,datasets:[{label:'Debt/Equity',data:D.de,borderColor:COL.amber,tension:.3,pointRadius:3},{label:'Дълг/EBITDA',data:D.debtEbitda,borderColor:COL.red,tension:.3,pointRadius:3}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:gridO,y:{grid:{color:COL.grid},ticks:{color:COL.txt},suggestedMin:0,suggestedMax:Math.max.apply(null,[D.thresholds.debtEbitda].concat(D.debtEbitda))+0.2}}},plugins:[hline([[D.thresholds.de,COL.amber,'D/E праг '+D.thresholds.de],[D.thresholds.debtEbitda,COL.red,'Дълг/EBITDA праг '+D.thresholds.debtEbitda]])]});
  new Chart(g('chPE'),{type:'line',data:{labels:D.labels,datasets:[{label:'P/E',data:D.pe,borderColor:COL.blue,backgroundColor:'rgba(76,141,255,.12)',fill:true,tension:.3,pointRadius:3}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:gridO,y:{grid:{color:COL.grid},ticks:{color:COL.txt},suggestedMin:0,suggestedMax:Math.max.apply(null,[D.thresholds.peHigh].concat(D.pe))+6}}},plugins:[hline([[D.thresholds.peLow,COL.green,'праг '+D.thresholds.peLow],[D.thresholds.peHigh,COL.amber,'таван '+D.thresholds.peHigh]])]});
  new Chart(g('chScore'),{type:'bar',data:{labels:D.metrics.map(function(m){return m.name;}),datasets:[{label:'% покритие',data:D.metrics.map(function(m){return m.coverage;}),backgroundColor:D.metrics.map(function(m){return m.status==='g'?COL.green:m.status==='a'?COL.amber:COL.red;}),borderRadius:5}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.parsed.x+'% спрямо прага';}}}},scales:{x:{grid:{color:COL.grid},ticks:{color:COL.txt,callback:pctTick},suggestedMax:Math.max.apply(null,[120].concat(D.metrics.map(function(m){return m.coverage;})))+50},y:{grid:{color:COL.grid},ticks:{color:COL.txt}}}},plugins:[{id:'vl',afterDraw:function(c){var ctx=c.ctx,a=c.chartArea,sc=c.scales;var xp=sc.x.getPixelForValue(100);ctx.save();ctx.strokeStyle=COL.red;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(xp,a.top);ctx.lineTo(xp,a.bottom);ctx.stroke();ctx.fillStyle=COL.red;ctx.font='bold 10px sans-serif';ctx.fillText('100% = праг',xp+4,a.top+10);ctx.restore();}}]});
}
if (typeof Chart !== 'undefined') { drawCharts(); }
else {
  var w=document.createElement('div'); w.className='note'; w.style.borderLeftColor='var(--amber)';
  w.innerHTML='<b>Графиките не се заредиха.</b> Изглежда няма интернет връзка за библиотеката Chart.js (cdnjs.cloudflare.com). Таблиците и оценките по-горе са пълни и валидни.';
  document.querySelector('.wrap').appendChild(w);
}
